<nav class="navbar navbar-expand bg-white border-bottom shadow-sm px-3 py-2">

    <i class="bi bi-list"></i>
  </button>
  <span class="navbar-brand d-lg-none mb-0 h5">DEIConnect</span>

          <span class="d-block text-muted" style="font-size:.72rem">{{ auth.currentUser()?.role | roleLabel }}</span>
        </span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow">
        <li><a class="dropdown-item" routerLink="/profile"><i class="bi bi-person me-2"></i>My Profile</a></li>
