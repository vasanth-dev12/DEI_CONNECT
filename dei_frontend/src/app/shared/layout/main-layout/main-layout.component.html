<div class="app-shell d-flex">
  <div class="d-none d-lg-block">
    <app-sidebar></app-sidebar>
  </div>

  @if (mobileOpen()) {
    <div class="position-fixed top-0 start-0 h-100 d-lg-none" style="z-index:1050;">
      <app-sidebar (navigate)="mobileOpen.set(false)"></app-sidebar>
    </div>
    <div class="modal-backdrop fade show d-lg-none" (click)="mobileOpen.set(false)"></div>
  }

  <div class="app-content d-flex flex-column">
    <app-navbar (toggleSidebar)="mobileOpen.set(!mobileOpen())"></app-navbar>
    <main class="p-3 p-md-4 flex-grow-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
