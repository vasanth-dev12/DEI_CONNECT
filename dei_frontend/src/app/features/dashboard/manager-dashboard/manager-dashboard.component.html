<div class="d-flex flex-wrap justify-content-end gap-2 mb-3">
  <a routerLink="/diversity/snapshots" [queryParams]="{ generate: 1 }" class="btn btn-primary">
    <i class="bi bi-bar-chart-steps me-1"></i> Generate Representation Snapshot
  </a>
</div>

<div class="row g-3">
  <div class="col-sm-6 col-lg-3">
    <app-stat-card
      label="Assigned Employees" [value]="assignedEmployees()" icon="bi-people" color="primary" link="/users"
    ></app-stat-card>
  </div>
  <div class="col-sm-6 col-lg-3">
    <app-stat-card
      label="My Surveys" [value]="mySurveys()" icon="bi-clipboard-data" color="info" link="/surveys"
    ></app-stat-card>
  </div>
  <div class="col-sm-6 col-lg-3">
    <app-stat-card
      label="My ERG Groups" [value]="myErgs()" icon="bi-diagram-3" color="success" link="/ergs"
    ></app-stat-card>
  </div>
  <div class="col-sm-6 col-lg-3">
    <app-stat-card
      label="Goals" [value]="myGoals()" icon="bi-bullseye" color="warning" link="/goals"
    ></app-stat-card>
  </div>
</div>

<div class="row g-3 mt-1">
  <div class="col-sm-6 col-lg-3">
    <app-stat-card
      label="Diversity Snapshots" value="View" icon="bi-bar-chart-steps" color="secondary" link="/diversity/snapshots"
    ></app-stat-card>
  </div>
</div>
