server.port=8060
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.routes[0].id=deiconnect-backend
spring.cloud.gateway.routes[0].uri=lb://deiconnect-backend
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**, /api/auth/**, /api/pay-equity/**, /api/reports/**, /api/demographic-profiles/**, /api/goals/**, /api/notifications/**, /api/representation-snapshots/**, /api/audit-logs/**, /actuator/**
spring.cloud.gateway.routes[0].filters[0]=JwtValidation

spring.cloud.gateway.routes[1].id=survey-service
spring.cloud.gateway.routes[1].uri=lb://survey-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/surveys/**
spring.cloud.gateway.routes[1].filters[0]=JwtValidation

spring.cloud.gateway.routes[2].id=erg-service
spring.cloud.gateway.routes[2].uri=lb://erg-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/ergs/**
spring.cloud.gateway.routes[2].filters[0]=JwtValidation

spring.cloud.gateway.routes[3].id=monolith-openapi
spring.cloud.gateway.routes[3].uri=lb://deiconnect-backend
spring.cloud.gateway.routes[3].predicates[0]=Path=/dei-connect/v3/api-docs
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/dei-connect/v3/api-docs, /v3/api-docs

spring.cloud.gateway.routes[4].id=survey-openapi
spring.cloud.gateway.routes[4].uri=lb://survey-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/survey-service/v3/api-docs
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/survey-service/v3/api-docs, /v3/api-docs

spring.cloud.gateway.routes[5].id=erg-openapi
spring.cloud.gateway.routes[5].uri=lb://erg-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/erg-service/v3/api-docs
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/erg-service/v3/api-docs, /v3/api-docs

springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=API Gateway
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Monolith (dei-connect)
springdoc.swagger-ui.urls[1].url=/dei-connect/v3/api-docs
springdoc.swagger-ui.urls[2].name=Survey Service
springdoc.swagger-ui.urls[2].url=/survey-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=ERG Service
springdoc.swagger-ui.urls[3].url=/erg-service/v3/api-docs

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

