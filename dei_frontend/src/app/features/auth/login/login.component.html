<div class="card shadow-lg border-0">
  <div class="card-body p-4 p-md-5">
    <h1 class="h4 mb-4 text-center page-title">Sign in</h1>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="invalid('email')"
            autocomplete="username"
            placeholder="you@deiconnect.com"
          />
        </div>
        @if (invalid('email')) {
          <div class="text-danger small mt-1">A valid email is required.</div>
        }
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="invalid('password')"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button class="btn btn-outline-secondary" type="button" (click)="showPassword.set(!showPassword())">
            <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
          </button>
        </div>
        @if (invalid('password')) {
          <div class="text-danger small mt-1">Password is required.</div>
        }
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2">
          </span> }
        Sign in
      </button>
    </form>

    <div class="text-center mt-3">
      <a routerLink="/forgot-password" class="small text-decoration-none">Forgot password?</a>
    </div>
  </div>
</div>
