@if (totalPages > 1) {
  <nav class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
    <small class="text-muted">
      Page {{ page + 1 }} of {{ totalPages }} · {{ totalElements }} item(s)
    </small>
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="page === 0">
        <button class="page-link" (click)="go(page - 1)">&laquo;</button>
      </li>
      @for (p of pages(); track p) {
        <li class="page-item" [class.active]="p === page">
          <button class="page-link" (click)="go(p)">{{ p + 1 }}</button>
        </li>
      }
      <li class="page-item" [class.disabled]="page >= totalPages - 1">
        <button class="page-link" (click)="go(page + 1)">&raquo;</button>
      </li>
    </ul>
  </nav>
}
