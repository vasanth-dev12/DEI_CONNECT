<app-page-header [title]="isEdit() ? 'Edit user' : 'New user'"
  [subtitle]="isEdit() ? 'Update role, status and assignments' : 'Create an account with any role'">
  <button class="btn btn-outline-secondary" (click)="cancel()"><i class="bi bi-x-lg me-1"></i> Cancel</button>
</app-page-header>

<div class="card shadow-sm">
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <div class="row g-3">
        @if (!isEdit()) {
          <div class="col-md-6">
            <label class="form-label">Employee ID *</label>
            <input class="form-control" formControlName="employeeId" [class.is-invalid]="invalid('employeeId')" />
          </div>
        }
        <div class="col-md-6">
          <label class="form-label">Full name *</label>
          <input class="form-control" formControlName="name" [class.is-invalid]="invalid('name')" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Email *</label>
          <input type="email" class="form-control" formControlName="email" [class.is-invalid]="invalid('email')" />
        </div>
        @if (!isEdit()) {
          <div class="col-md-6">
            <label class="form-label">Password *</label>
            <input type="password" class="form-control" formControlName="password" [class.is-invalid]="invalid('password')" autocomplete="new-password" />
            <div class="form-text">Minimum 8 characters.</div>
          </div>
        }
        <div class="col-md-6">
          <label class="form-label">Role *</label>
          <select class="form-select" formControlName="role">
            @for (r of roles; track r) { <option [value]="r">{{ r | roleLabel }}</option> }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Department *</label>
          <select class="form-select" formControlName="departmentName">
            @for (d of departments; track d) {
              <option [value]="d">{{ d | enumLabel }}</option> }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Grade ID</label>
          <input type="number" min="0" class="form-control" formControlName="gradeId" [class.is-invalid]="invalid('gradeId')" />
          @if (invalid('gradeId')) {
            <div class="invalid-feedback">Grade ID cannot be negative.</div>
          }
        </div>
        <div class="col-md-6">
          <label class="form-label">Salary *</label>
          <input type="number" min="0" step="0.01" class="form-control" formControlName="salary" [class.is-invalid]="invalid('salary')" />
          <div class="form-text">Sensitive — visible only to Admin and the employee's HR partner.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Years of experience *</label>
          <input type="number" min="0" class="form-control" formControlName="yearsOfExperience" [class.is-invalid]="invalid('yearsOfExperience')" />
        </div>
        @if (isEdit()) {
          <div class="col-md-6">
            <label class="form-label">Status *</label>
            <select class="form-select" formControlName="status">
              @for (s of statuses; track s) {
                <option [value]="s">{{ s | enumLabel }}</option>
              }
            </select>
          </div>
        }

        @if (isEmployeeRole()) {
          <div class="col-12"><hr /><p class="text-muted small mb-0">Employees must be assigned a manager and an HR partner.</p></div>
          <div class="col-md-6">
            <label class="form-label">Manager (DEI_MANAGER) *</label>
            <select class="form-select" formControlName="managerId" [class.is-invalid]="invalid('managerId')">
              <option [ngValue]="null">Select a manager…</option>
              @for (m of managers(); track m.userId) {
                <option [ngValue]="m.userId">{{ m.name }} ({{ m.employeeId }})</option>
              }
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">HR Partner (HR_BIZ_PARTNER) *</label>
            <select class="form-select" formControlName="hrId" [class.is-invalid]="invalid('hrId')">
              <option [ngValue]="null">Select an HR partner…</option>
              @for (h of hrPartners(); track h.userId) {
                 <option [ngValue]="h.userId">{{ h.name }} ({{ h.employeeId }})</option>
                }
            </select>
          </div>
        }
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          @if (saving()) { <span class="spinner-border spinner-border-sm me-2"></span> }
          {{ isEdit() ? 'Save changes' : 'Create user' }}
        </button>
      </div>
    </form>
  </div>
</div>
